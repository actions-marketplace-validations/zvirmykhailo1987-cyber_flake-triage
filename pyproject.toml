[project]
name = "flake-triage"
version = "0.1.0"
description = "Should this failed CI job be retried? Rules first, a model only where rules are unsure, every claim tied to a log line. CLI, web console and MCP server, measured on a real project's GitHub Actions history."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Mykhailo Zvir" }]
requires-python = ">=3.12"
dependencies = [
  "anthropic>=2.11",
  "httpx>=0.28",
  "fastapi>=0.165",
  "uvicorn>=0.38",
  "jinja2>=3.1",
  "python-multipart>=0.0.20",
  "mcp>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=6", "hypothesis>=6.135", "ruff>=0.14", "mypy>=1.18", "pip-audit>=2.9", "bandit>=1.8"]

[project.scripts]
flake-collect = "flaketriage.collect:main"
flake-eval = "flaketriage.evals:main"
flake-triage = "flaketriage.cli:main"
flake-web = "flaketriage.web:main"
flake-mcp = "flaketriage.mcp_server:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
flaketriage = ["templates/*.html", "static/*", "static/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.coverage.run]
branch = true
source = ["flaketriage"]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_also = ['if __name__ == .__main__.:', 'def main\(\)']

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B", "RUF012", "E501"]
"scripts/*" = ["S", "E501", "E402"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
mypy_path = "src"
packages = ["flaketriage"]
